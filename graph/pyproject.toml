[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: requires an explicitly isolated Neo4j test database",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".backups",
  ".venv",
  "data",
  "application/frontend",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
