# Controlled HTTP deployment. Add a domain, TLS, and real user authentication
# before exposing learner data as a public production service.
limit_req_zone $binary_remote_addr zone=adaptive_api_per_ip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=adaptive_conn_per_ip:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/knowledge-graph;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        include proxy_params;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000/health/live;
        include proxy_params;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:8000/health/ready;
        include proxy_params;
    }

    location = /metrics { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location ^~ /api/v1/ {
        limit_req zone=adaptive_api_per_ip burst=30 nodelay;
        limit_conn adaptive_conn_per_ip 20;
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_read_timeout 60s;
    }

    location ^~ /tutor-api/ {
        limit_req zone=adaptive_api_per_ip burst=30 nodelay;
        limit_conn adaptive_conn_per_ip 20;
        proxy_pass http://127.0.0.1:8600/api/;
        include proxy_params;
        proxy_read_timeout 120s;
    }

    location ^~ /api/ {
        limit_req zone=adaptive_api_per_ip burst=30 nodelay;
        limit_conn adaptive_conn_per_ip 20;
        proxy_pass http://127.0.0.1:8600;
        include proxy_params;
        proxy_read_timeout 120s;
    }

    location /tutor/ {
        proxy_pass http://127.0.0.1:8600/;
        include proxy_params;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
